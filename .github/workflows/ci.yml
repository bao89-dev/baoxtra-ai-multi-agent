name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        shell: bash
        run: |
          mkdir -p out
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee out/test-output.txt
      - name: Upload CI log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: out/test-output.txt
          retention-days: 30
