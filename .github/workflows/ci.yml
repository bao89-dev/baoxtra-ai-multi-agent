name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Control API test dependencies
        run: python -m pip install -r requirements-control-api.txt
      - name: Unit tests
        shell: bash
        run: |
          mkdir -p out
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee out/test-output.txt
      - name: Upload CI log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: out/test-output.txt
          retention-days: 30

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Frontend contract tests
        run: npm test
      - name: Next.js build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
